# Configuration Dependabot pour auto-merge

version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Gon3s"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    # Auto-merge configuration
    allow:
      - dependency-type: "direct"
    
  # Frontend npm dependencies (pour plus tard)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "Gon3s"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    allow:
      - dependency-type: "direct"
    
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
