[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-branch

markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, file system)
    e2e: End-to-end tests (full API tests)
