version: '3.8'

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lorcana-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/lorcana_cards.db
      - UPLOAD_FOLDER=/app/uploads
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.2-90b-vision-preview}
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-4200}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backend:/app
    networks:
      - lorcana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lorcana-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - lorcana-network
    restart: unless-stopped

networks:
  lorcana-network:
    driver: bridge

volumes:
  db-data:
  upload-data:
